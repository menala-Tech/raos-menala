name: Deploy GAS via clasp

# Sesi 22 — auto-push ke Google Apps Script di-disable.
# Spec baru RIFIM OS: "spreadsheet hanya untuk otomatisasi dokumen
# pasif (Smart Office)". CRUD operasional pindah ke Supabase + PWA
# (Finance Dashboard, /antrian-driver, dst). GAS module RAOS sekarang
# residual (sync satu arah + reminder), tidak perlu deploy tiap merge.
#
# Normal state: workflow_dispatch only.
# P8 closure: temporary push trigger below executes this one production redeploy;
# this workflow is restored to manual-only immediately after the run is triggered.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gas-deploy.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write .clasprc.json from secret
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Verify clasp config
        working-directory: gas
        run: |
          cat .clasp.json
          clasp --version
          clasp status || echo "status warn"

      - name: Push GAS to Script Editor
        working-directory: gas
        run: clasp push --force

      - name: Redeploy existing RAOS Web App
        working-directory: gas
        env:
          RAOS_DEPLOYMENT_ID: AKfycbxrgQ_MWvsdA_bsbNF4deIALWATDCspYvY47fakpuXMZeAtGAd4baeVVe1dPGDAi1tZJA
          RAOS_WEBAPP_URL: https://script.google.com/macros/s/AKfycbxrgQ_MWvsdA_bsbNF4deIALWATDCspYvY47fakpuXMZeAtGAd4baeVVe1dPGDAi1tZJA/exec
        run: |
          clasp list-deployments
          clasp update-deployment "$RAOS_DEPLOYMENT_ID" -d "P8 role smoke closure 2026-08-10 ${GITHUB_SHA::12}"
          clasp list-deployments
          body="$(curl -fsSL "$RAOS_WEBAPP_URL")"
          printf '%s\n' "$body"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok || x.service!=="RAOS Web API") process.exit(1)' "$body"

      - name: Summary
        run: |
          echo "GAS pushed and existing Web App redeployed."
          echo "scriptId=$(cat gas/.clasp.json | grep scriptId | cut -d'\"' -f4)"
          echo "deploymentId=AKfycbxrgQ_MWvsdA_bsbNF4deIALWATDCspYvY47fakpuXMZeAtGAd4baeVVe1dPGDAi1tZJA"
          echo "URL unchanged: https://script.google.com/macros/s/AKfycbxrgQ_MWvsdA_bsbNF4deIALWATDCspYvY47fakpuXMZeAtGAd4baeVVe1dPGDAi1tZJA/exec"
