name: Deploy GAS via clasp

# Sesi 22 — auto-push ke Google Apps Script di-disable.
# Spec baru RIFIM OS: "spreadsheet hanya untuk otomatisasi dokumen
# pasif (Smart Office)". CRUD operasional pindah ke Supabase + PWA
# (Finance Dashboard, /antrian-driver, dst). GAS module RAOS sekarang
# residual (sync satu arah + reminder), tidak perlu deploy tiap merge.
#
# Trigger hanya manual (workflow_dispatch) — kalau memang perlu push
# perubahan GAS. Otherwise, edit langsung di Script Editor.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write .clasprc.json from secret
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Verify clasp config
        working-directory: gas
        run: |
          cat .clasp.json
          clasp --version
          clasp status || echo "status warn"

      - name: Push GAS to Script Editor
        working-directory: gas
        run: clasp push --force

      - name: Summary
        run: |
          echo "GAS pushed to scriptId=$(cat gas/.clasp.json | grep scriptId | cut -d'\"' -f4)"
          echo "Next: run setupAllTriggers() manually from Script Editor to activate new intervals"
