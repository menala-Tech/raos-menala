name: Temporary patch Poin 7

on:
  push:
    branches:
      - feat/saldo-reminder-belum-diisi

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/saldo-reminder-belum-diisi
          fetch-depth: 0

      - name: Apply exact Poin 7 patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('gas/16_saldo_sync.gs')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'/\*\*\n \* Reminder chat 5-menit:.*?\nfunction reminderSaldoBelumDiisi\(\) \{.*?\n\}\n?\Z', re.S)
          new = r'''/**
           * Poin 7 (2026-08-08): cron 5-menit reminder chat "Belum Diisi".
           * Request eligible: belum diproses, umur >5 menit, reminder terakhir
           * NULL atau sudah >5 menit. Post WAJIB via raos_post_system_message.
           */
          function reminderSaldoBelumDiisi() {
            const lock = LockService.getScriptLock()
            if (!lock.tryLock(10000)) {
              logSistem('cron', 'reminderSaldoBelumDiisi', 'skipped',
                'Run sebelumnya masih aktif — skip duplicate reminder')
              return { success: true, skipped: true }
            }

            try {
              const now = new Date()
              const nowIso = now.toISOString()
              const cutoffIso = new Date(now.getTime() - 5 * 60 * 1000).toISOString()
              const rows = callSupabase(
                'raos_saldo_requests?is_processed=eq.false&status=in.(pending,approved)' +
                '&requested_at=lt.' + encodeURIComponent(cutoffIso) +
                '&or=(last_reminded_at.is.null,last_reminded_at.lt.' + encodeURIComponent(cutoffIso) + ')' +
                '&select=id,request_no,requested_at,nominal,driver_name,' +
                'staff:user_profiles!staff_id(full_name),' +
                'branch:branches!branch_id(id,name)' +
                '&order=requested_at.asc&limit=50'
              ) || []

              if (!rows.length) {
                logSistem('cron', 'reminderSaldoBelumDiisi', 'success',
                  'Tidak ada request saldo yang perlu reminder')
                return { success: true, reminded: 0, failed: 0 }
              }

              let reminded = 0
              let failed = 0
              rows.forEach(r => {
                if (!r.branch?.id) return
                try {
                  const roomId = callSupabase('rpc/raos_resolve_saldo_room', 'POST', {
                    p_branch_id: r.branch.id,
                  })
                  if (!roomId) throw new Error(`Room Pengisian Saldo tidak ditemukan untuk ${r.branch.name}`)

                  const requested = new Date(r.requested_at)
                  const minutes = Math.max(5, Math.floor((now.getTime() - requested.getTime()) / 60000))
                  const content = [
                    '⏰ BELUM DIISI — PENGAJUAN SALDO', '',
                    `Cabang: ${r.branch.name}`,
                    `No Request: ${r.request_no || '-'}`,
                    `Staff: ${r.staff?.full_name || '-'}`,
                    `Driver: ${r.driver_name || '-'}`,
                    `Nominal: Rp ${(Number(r.nominal) || 0).toLocaleString('id-ID')}`,
                    `Menunggu: ${minutes} menit`, '',
                    'Mohon segera proses pengisian saldo di AIST melalui Finance RIFIM OS.',
                  ].join('\n')

                  callSupabase('rpc/raos_post_system_message', 'POST', {
                    p_room_id: roomId,
                    p_content: content,
                    p_category: 'saldo_reminder',
                    p_metadata: {
                      source: 'raos_gas', event: 'saldo_belum_diisi',
                      request_id: r.id, request_no: r.request_no,
                      branch_id: r.branch.id, branch_name: r.branch.name,
                      reminded_at: nowIso,
                    },
                  })

                  callSupabase(`raos_saldo_requests?id=eq.${encodeURIComponent(r.id)}`,
                    'PATCH', { last_reminded_at: nowIso })
                  reminded++
                } catch (rowErr) {
                  failed++
                  logSistem('error', 'reminderSaldoBelumDiisi', 'error',
                    `${r.request_no || r.id}: ${rowErr.message}`)
                }
              })

              logSistem('cron', 'reminderSaldoBelumDiisi', failed ? 'warning' : 'success',
                `${reminded} request di-remind, ${failed} error`)
              return { success: failed === 0, reminded, failed }
            } catch (e) {
              logSistem('error', 'reminderSaldoBelumDiisi', 'error', e.message)
              return { success: false, message: e.message }
            } finally {
              lock.releaseLock()
            }
          }
          '''.replace('\n          ', '\n').lstrip()
          s2, count = pattern.subn(new, s, count=1)
          if count != 1:
              raise SystemExit(f'gas/16 reminder replacement expected once, found {count}')
          p.write_text(s2, encoding='utf-8')

          p = Path('gas/09_trigger.gs')
          s = p.read_text(encoding='utf-8')
          old = """  // Reminder chat \"SALDO BELUM DIPROSES\" untuk request >5 menit yang belum
          // dicentang. Cron 15 MENIT (dari 5) — cukup, kirim reminder tetap tepat waktu.
          ScriptApp.newTrigger('reminderSaldoBelumDiisi')
            .timeBased().everyMinutes(15).create()"""
          new = """  // Poin 7: reminder chat \"BELUM DIISI\" pertama setelah >5 menit dan
          // berulang tiap 5 menit selama request belum diproses. Dedup authoritative
          // via raos_saldo_requests.last_reminded_at.
          ScriptApp.newTrigger('reminderSaldoBelumDiisi')
            .timeBased().everyMinutes(5).create()"""
          if s.count(old) != 1:
              raise SystemExit(f'gas/09 trigger context count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('apps/pwa/src/app/riwayat/page.tsx')
          s = p.read_text(encoding='utf-8')
          old_paid = "status: 'paid', label: 'PAID', emoji: '🔵', icon: Wallet,"
          new_paid = "status: 'paid', label: 'SUDAH DIISI', emoji: '✅', icon: Wallet,"
          old_pending = "status: 'pending', label: 'PENDING', emoji: '🟡', icon: Clock,"
          new_pending = "status: 'pending', label: 'BELUM DIISI', emoji: '⏰', icon: Clock,"
          if s.count(old_paid) != 1 or s.count(old_pending) != 1:
              raise SystemExit(f'riwayat context paid={s.count(old_paid)} pending={s.count(old_pending)}')
          p.write_text(s.replace(old_paid, new_paid, 1).replace(old_pending, new_pending, 1), encoding='utf-8')
          PY

      - name: Validate RAOS PWA
        working-directory: apps/pwa
        run: |
          npm ci
          npm run check

      - name: Commit actual changes and remove temp workflow
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          rm .github/workflows/_tmp_patch_poin7.yml
          git add gas/16_saldo_sync.gs gas/09_trigger.gs apps/pwa/src/app/riwayat/page.tsx .github/workflows/_tmp_patch_poin7.yml
          git commit -m "feat(saldo): reminder chat 5-menit + label Belum Diisi (poin 7)" -m "Co-Authored-By: ChatGPT <noreply@openai.com>"
          git push origin HEAD:feat/saldo-reminder-belum-diisi
