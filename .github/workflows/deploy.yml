name: Lint & Type Check

# Deploy production dilakukan otomatis oleh integrasi native Vercel<->GitHub
# (Vercel Dashboard -> Settings -> Git, Root Directory: apps/pwa), BUKAN oleh
# workflow ini. Workflow ini murni gate kualitas kode (lint + type check).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/pwa/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
