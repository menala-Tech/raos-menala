// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Kotlin support for the RAOS background-location foreground Service
        // (android/app/src/main/java/com/rifim/raos/location/) — the rest of
        // the Capacitor-generated shell stays Java, only this new module is
        // Kotlin (FusedLocationProviderClient/WorkManager ergonomics).
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            // Align all Kotlin stdlib/coroutines artifacts with the Kotlin 1.9.24
            // compiler used by this project so third-party Capacitor plugins can
            // compile without "metadata version" mismatches.
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
            force 'org.jetbrains.kotlin:kotlin-reflect:1.9.24'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.7.3'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
